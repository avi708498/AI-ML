<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1a1a1a" />
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Decision Helper" />
  <meta name="description" content="AI-powered decision helper that asks smart questions to guide your choices." />
  <title>AI Decision Helper</title>

  <!-- Tabler Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />

  <!-- App styles -->
  <link rel="stylesheet" href="src/styles/base.css" />
  <link rel="stylesheet" href="src/styles/components.css" />
  <link rel="stylesheet" href="src/styles/animations.css" />

  <style>
    /* Safe area insets for notched phones (iPhone X+) */
    .app-shell {
      padding-top: max(1rem, env(safe-area-inset-top));
      padding-bottom: max(3rem, env(safe-area-inset-bottom));
      padding-left: max(0.75rem, env(safe-area-inset-left));
      padding-right: max(0.75rem, env(safe-area-inset-right));
    }
  </style>
</head>
<body>

  <div class="app-shell">
    <h1 class="sr-only">AI Decision Helper</h1>

    <!-- Header -->
    <header class="app-header">
      <div class="logo-icon" aria-hidden="true">
        <i class="ti ti-git-fork" style="font-size: 16px;"></i>
      </div>
      <span class="logo-text">Decision Helper</span>
    </header>

    <!-- Dynamic content rendered by main.js -->
    <main class="main-pane" id="main-pane"></main>
  </div>

  <!-- App entry point (ES modules) -->
  <script type="module" src="src/main.js"></script>
</body>
</html>
